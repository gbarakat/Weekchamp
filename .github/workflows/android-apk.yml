name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx expo-doctor

      - name: Read app version
        id: version
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Signed with the React Native template debug keystore: installable for testing,
      # not for the Play Store.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      # Android only installs an update over an existing app when both are signed with the same
      # certificate. The expected value is the certificate of the v1 APK (run 44473865949). If the
      # template keystore ever changes, fail here instead of shipping an APK that forces users to
      # uninstall (and lose their data).
      - name: Check signing certificate
        env:
          EXPECTED_SHA256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signing certificate changed. This APK would not install over earlier versions."
            exit 1
          fi

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "weekchamp-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: weekchamp-v${{ steps.version.outputs.version }}-apk
          path: weekchamp-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

  # Pushing a tag like v2.0.0 publishes the APK on a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check the tag matches the app version
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$VERSION in app.json."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: weekchamp-v${{ needs.build.outputs.version }}-apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "weekchamp-v$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weekchamp v$VERSION" \
            --generate-notes
